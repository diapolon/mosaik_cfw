# Area di avvio delle immagini (boot0, U-Boot, kernel, initramfs, sdgrow): l'aggiornamento Wi-Fi
# non la può cambiare, arriva solo riscrivendo la SD.
#
# GENERAZIONE: +1 a ogni cambio dell'area di avvio. L'initramfs la scrive in
# Arcade/System/area-avvio.txt (le schede scritte prima non hanno il file: generazione 0).
# 1: 0.9.17, spegnimento dal chip di alimentazione col caricatore nell'initramfs (errori e
#    primo avvio), axpctl nell'initramfs.
# 2: 0.9.53, esito dell'allargamento della SD sempre in Logs/sdgrow.txt (issue #7).
# 3: sdgrow allarga la partizione anche con il limite utile della GPT già in fondo (issue #7,
#    audit SDGROW) e controlla GPT e FAT prima di scrivere; esito 5 se la tabella è allargata ma
#    il kernel vede la partizione vecchia; Logs/sdgrow.txt anche per l'esito 3 (prima del
#    riavvio) e per un "niente da fare" con la partizione piccola, ruotato a 20 KB.
GENERAZIONE=3
#
# RISCRIVERE_SOTTO: le schede con una generazione più bassa di questa ricevono, nella finestra
# dell'aggiornamento, l'invito a riscrivere la SD (riga "reinstall N" dell'elenco firmato).
# Si alza solo quando conviene davvero; 0 = nessun invito.
RISCRIVERE_SOTTO=0
