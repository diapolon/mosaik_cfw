# Impostazioni di partenza di Mosaik per mupen64plus sulla TrimUI (A133P, PowerVR GE8300).
# Comandi: levetta sinistra = levetta del N64, croce = croce, tasto in basso = A, tasto a
# sinistra = B, levetta destra = i quattro tasti C (anche tasto a destra = C giù, tasto in alto =
# C sinistra), L1 = L, R1 = R, L2 e R2 = Z, Start = Start. Si cambiano qui, in Saves/n64/mupen64plus.

