; impostazioni iniziali di Mosaik per PPSSPP sulla TrimUI (A133P, PowerVR GE8300): risoluzione
; nativa della PSP, salto dei fotogrammi automatico, niente contatori a schermo. Si cambiano dal
; menu di PPSSPP (Menu breve) e restano in Saves/psp.
[General]
FirstRun = False
CheckForNewVersion = False
EnableStateUndo = False
[CPU]
CPUCore = 1
FastMemoryAccess = True
[Graphics]
GraphicsBackend = 0 (OPENGL)
InternalResolution = 1
FrameSkip = 0
AutoFrameSkip = True
FrameSkipType = 0
BufferFiltering = 1
TextureFiltering = 1
FullScreen = True
ShowFPSCounter = 0
VSync = True
[Sound]
AudioLatency = 1
[SystemParam]
PSPModel = 1
